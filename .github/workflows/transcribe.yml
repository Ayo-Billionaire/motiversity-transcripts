name: transcribe
on:
  workflow_dispatch:
    inputs:
      start: { description: "first episode index", default: "0" }
      end: { description: "last episode index, exclusive", default: "1393" }
      shard: { description: "episodes per job", default: "10" }
      model: { description: "faster-whisper model", default: "small.en" }
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          s, e, k = int("${{ inputs.start }}"), int("${{ inputs.end }}"), int("${{ inputs.shard }}")
          print("matrix=" + json.dumps({"include": [{"a": a, "b": min(a + k, e)} for a in range(s, e, k)]}))
          PY
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install faster-whisper==1.1.1 requests
      - run: python3 extract_cloud.py ${{ matrix.a }} ${{ matrix.b }} ${{ inputs.model }}
      - name: commit transcripts
        if: always()
        run: |
          git config user.name "transcribe-bot"; git config user.email "bot@users.noreply.github.com"
          git add transcripts
          git diff --cached --quiet && exit 0
          git commit -m "transcripts ${{ matrix.a }}-${{ matrix.b }}"
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && exit 0; sleep $((RANDOM % 10 + 3)); done
          exit 1
